<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <link rel="stylesheet" href="dashboard.css">
</head>

<body>

    <!-- MENÚ LATERAL -->

    <nav class="sidebar">

        <h2>Mi Sistema</h2>

        <div class="menu">

            <a href="dashboard.html">Inicio</a>

            <a href="registro.html">Registrar usuario</a>

            <a href="usuarios.html">Usuarios</a>

            <a href="login.html">Cerrar sesión</a>

        </div>

    </nav>


    <!-- CONTENIDO PRINCIPAL -->

    <main class="contenido">

        <h1>Dashboard</h1>

        <p>Bienvenido al panel de administración</p>


        <!-- CONTENEDOR DE KPI CARDS -->

        <div class="contenedorCards">


            <!-- KPI 1 -->

            <div class="card">

                <div class="icono">
                    👥
                </div>

                <div class="cardInfo">

                    <h3>Stats</h3>

                    <p>150</p>

                </div>

            </div>


            <!-- KPI 2 -->

            <div class="card">

                <div class="icono">
                    📊
                </div>

                <div class="cardInfo">

                    <h3>Stats</h3>

                    <p>85</p>

                </div>

            </div>


            <!-- KPI 3 -->

            <div class="card">

                <div class="icono">
                    📋
                </div>

                <div class="cardInfo">

                    <h3>Stats</h3>

                    <p>320</p>

                </div>

            </div>

        </div>


        <button class="botonAgregarProducto" type="button" id="botonAgregarProducto">
            agregar producto
        </button>

        <!-- Modal -->
        <div class="modal" id="modal">
            <div class="modalContenido">
                <h2>Registrar producto</h2>
                <div class="campo">
                    <label>Nombre Producto</label>
                    <input type="text" id="nombreProducto">
                </div>
                <div class="campo">
                    <label>Cantidad </label>
                    <input type="number" id="cantidadProducto">


                </div>

                <div class="campo">
                    <label>sku</label>
                    <input type="text" id="sku">
                </div>
                <div class="botonesModal">
                    <button type="button" id="botonCerrar">
                        Cerrar
                    </button>

                    <button type="button" id="botonGuardar">
                        Guardar
                    </button>

                    

                </div>

            </div>
        </div>

        <script src="dashboard.js"></script>


    </main>

</body>

</html>
